[project]
name = "chan-py"
version = "0.1.0"
description = "Chan (缠论) analysis and plotting toolkit with multi-source market data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "baostock>=0.8.8",
    "ccxt>=4.0.0",
    "ipython>=8.5.0",
    "matplotlib>=3.5.3",
    "numpy>=1.23.3",
    "pandas>=1.4.2",
    "requests>=2.22.0",
    "streamlit>=1.20.0",
    "yfinance>=0.2.0",
]

[project.optional-dependencies]
ml = [
    "xgboost>=1.7.0",
]

[tool.uv]
package = false
